# Fast checks for pull requests; exhaustive tests and Docker checks on main and manual runs.
# No paid AI requests, no deployment.
name: tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fast core regression tests
        run: npm run test:quick


  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-nanum
      - run: bash scripts/ci-fonts.sh
      - name: Entire regression suite
        run: npm run test:full

  docker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reels-story-maker:ci .
      - name: Smoke test /healthz
        run: |
          docker run -d --name rsm -p 8080:8080 -e RF_MASTER_KEY=ci-master-key-0123456789abcdef -e RF_ADMIN_PASSWORD=ci-admin-password-1 -v rsm_ci_data:/data reels-story-maker:ci
          for i in $(seq 30); do curl -sf localhost:8080/healthz && exit 0; sleep 1; done
          docker logs rsm; exit 1
