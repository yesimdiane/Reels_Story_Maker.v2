# Alternative host (Fly.io). Edit `app` and `primary_region` first. Secrets are set with `fly secrets set`, never in this file.
app = "reels-factory-studio"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  RF_PUBLIC_HOST = "reels-factory-studio.fly.dev"

[mounts]
  source = "rf_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
