<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<title>릴스 팩토리</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --muted: #6e6e73; --line: #d1d1d6;
    --accent: #0a66d6; --ok: #1a7f37; --warn: #a15c00; --bad: #c62828; --chip: #e9e9ef;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --muted: #a1a1a6; --line: #38383a;
      --accent: #4c9aff; --ok: #3fb950; --warn: #e3a008; --bad: #ff6b6b; --chip: #2c2c2e; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 8px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
  header .user { font-size: 12px; color: var(--muted); }
  main { padding: 12px 16px calc(env(safe-area-inset-bottom) + 90px); max-width: 720px; margin: 0 auto; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: none; color: var(--muted); padding: 8px 2px 10px; font-size: 12px;
    min-height: 56px; position: relative; }
  nav button.on { color: var(--accent); font-weight: 600; }
  nav .n { position: absolute; top: 4px; right: 18%; background: var(--bad); color: #fff; border-radius: 9px;
    font-size: 11px; min-width: 18px; padding: 0 5px; }
  nav .ico { display: block; font-size: 20px; line-height: 24px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin: 0 0 12px; border: 1px solid var(--line); }
  .card.tap { cursor: pointer; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
  h2 { font-size: 17px; margin: 18px 0 8px; }
  h3 { font-size: 15px; margin: 14px 0 6px; }
  .hook { font-weight: 600; font-size: 17px; margin: 6px 0; }
  .pre { white-space: pre-wrap; word-break: break-word; }
  .scene { border-top: 1px solid var(--line); padding: 10px 0 2px; }
  .flow { font-size: 15px; background: var(--chip); border-radius: 8px; padding: 8px; white-space: pre-wrap; word-break: break-word; }
  .flow.mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .btns.one { grid-template-columns: 1fr; }
  button.b { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font-size: 16px; font-weight: 600; padding: 8px 12px; }
  a.b { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--accent); font-size: 16px; font-weight: 600; padding: 8px 12px; text-decoration: none; }
  button.b:disabled { opacity: .45; }
  button.b.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.b.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  button.b.bad { color: var(--bad); }
  button.b:disabled { opacity: .5; }
  button.link { border: 0; background: none; color: var(--accent); font-size: 15px; padding: 8px 0; min-height: 44px; }
  textarea, input[type=text], input[type=url] { width: 100%; font: inherit; font-size: 16px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  textarea { min-height: 88px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .banner { border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; font-size: 14px; white-space: pre-wrap; }
  .banner.warn { background: rgba(227,160,8,.15); } .banner.bad { background: rgba(198,40,40,.13); }
  .hookwarn { background: rgba(227,160,8,.12); border-radius: 10px; padding: 6px 10px; margin: 6px 0; font-size: 13px; }
  .banner.ok { background: rgba(26,127,55,.13); }
  .tp { display: grid; grid-template-columns: 28px 1fr; gap: 4px 8px; align-items: start; padding: 6px 0; }
  .tp .dot { width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; font-size: 13px;
    background: var(--chip); }
  .tp .dot.done { background: var(--ok); color: #fff; }
  .video { position: relative; width: 100%; max-width: 360px; aspect-ratio: 9 / 16; margin: 8px auto;
    background: #000; border-radius: 12px; overflow: hidden; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .tabs2 { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .tabs2 button { flex: none; min-height: 36px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); padding: 4px 12px; font-size: 14px; }
  .tabs2 button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  details summary { min-height: 44px; display: flex; align-items: center; color: var(--accent); cursor: pointer; }
  .hist { font-size: 13px; border-top: 1px solid var(--line); padding: 6px 0; }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  #toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 72px); z-index: 9;
    background: #333; color: #fff; border-radius: 12px; padding: 12px; font-size: 14px; display: none; white-space: pre-wrap; }
  #busy { position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.25); display: none; place-items: center; }
  #busy div { background: var(--card); padding: 16px 20px; border-radius: 12px; }
</style>
</head>
<body>
<header>
  <h1 id="title">릴스 팩토리</h1>
  <div class="user" id="user"></div>
</header>
<main id="main"><div class="empty">불러오는 중…</div></main>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="busy"><div id="busyText">처리 중…</div></div>

<script>
'use strict';
// ---------------------------------------------------------------- helpers
// All data is rendered with textContent / attributes, never parsed as HTML.
function h(tag, attrs, children) {
  const el = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    const v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  });
  (children || []).forEach(function (c) {
    if (c == null || c === false) return;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return el;
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
function fmt(v) {
  if (!v) return '';
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  const p = function (n) { return (n < 10 ? '0' : '') + n; };
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function toast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, ms || 3500);
}
function busy(on, text) {
  document.getElementById('busyText').textContent = text || '처리 중…';
  document.getElementById('busy').style.display = on ? 'grid' : 'none';
}
function call(name) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve) {
    const runner = google.script.run
      .withSuccessHandler(function (res) { resolve(res || { ok: false, error: '빈 응답' }); })
      .withFailureHandler(function (err) { resolve({ ok: false, error: (err && err.message) || String(err) }); });
    if (!runner) {
      resolve({ ok: false, error: 'google.script.run 객체를 초기화할 수 없습니다.' });
      return;
    }
    if (typeof runner[name] === 'function') {
      try {
        runner[name].apply(runner, args);
      } catch (err) {
        resolve({ ok: false, error: (err && err.message) || String(err) });
      }
      return;
    }
    // Fallback: If direct runner method is missing on client proxy, route storyboard actions via apiAction
    if (typeof runner.apiAction === 'function') {
      try {
        if (name === 'apiGenerateStoryboardImages') {
          runner.apiAction(args[0], 'GENERATE_STORYBOARD_IMAGES', args[1]);
          return;
        }
        if (name === 'apiReviewStoryboardImage') {
          runner.apiAction(args[0], 'REVIEW_STORYBOARD_IMAGE', args[1]);
          return;
        }
        if (name === 'apiRegenerateStoryboardImage') {
          runner.apiAction(args[0], 'REGENERATE_STORYBOARD_IMAGE', args[1]);
          return;
        }
        if (name === 'apiRecoverStoryboardImage') {
          runner.apiAction(args[0], 'RECOVER_STORYBOARD_IMAGE', args[1]);
          return;
        }
      } catch (err) {
        resolve({ ok: false, error: (err && err.message) || String(err) });
        return;
      }
    }
    resolve({
      ok: false,
      error: 'Apps Script 함수 "' + name + '"를 실행할 수 없습니다. 대시보드를 새로고침하거나 최신 버전으로 다시 배포하세요.'
    });
  });
}
function copyText(text) {
  function fallback() {
    const ta = h('textarea', { readonly: true, style: 'position:fixed;top:0;left:0;opacity:0' });
    ta.value = text; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta); return ok;
  }
  const done = function (ok) { toast(ok ? '복사했습니다' : '복사하지 못했습니다. 길게 눌러 직접 복사하세요.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallback()); });
  } else { done(fallback()); }
}
function copyBlock(label, text, mono) {
  return h('div', {}, [
    h('div', { class: 'row', style: 'justify-content:space-between' }, [
      h('span', { class: 'muted', text: label }),
      h('button', { class: 'link', type: 'button', onclick: function () { copyText(text); }, text: '복사' }),
    ]),
    h('div', { class: 'flow' + (mono ? ' mono' : ''), text: text }),
  ]);
}

// ---------------------------------------------------------------- state
const TABS = [
  { key: 'script', ico: '📝', label: '대본', statuses: ['SCRIPT_REVIEW_PENDING', 'SCRIPT_CHANGES_REQUESTED'], badge: ['SCRIPT_REVIEW_PENDING'] },
  { key: 'make', ico: '🎬', label: '제작', statuses: ['SCRIPT_APPROVED', 'VIDEO_IN_PRODUCTION', 'VIDEO_FAILED', 'VIDEO_CHANGES_REQUESTED'], badge: ['VIDEO_FAILED'] },
  { key: 'video', ico: '▶️', label: '영상', statuses: ['VIDEO_REVIEW_PENDING'], badge: ['VIDEO_REVIEW_PENDING'] },
  { key: 'publish', ico: '📤', label: '게시', statuses: ['VIDEO_APPROVED', 'READY_TO_PUBLISH'], badge: ['READY_TO_PUBLISH', 'VIDEO_APPROVED'] },
  { key: 'products', ico: '🛍️', label: '상품' },
  { key: 'done', ico: '✅', label: '기록', statuses: ['COMPLETED', 'SCRIPT_REJECTED', 'VIDEO_REJECTED', ''] },
];
const S = { tab: 'script', dash: null, detail: null, mode: 'view' };

function tabFor(status) {
  for (let i = 0; i < TABS.length; i++) if (TABS[i].statuses && TABS[i].statuses.indexOf(status) !== -1) return TABS[i].key;
  return 'done';
}
function statusChip(status, label) {
  const cls = /REJECTED|FAILED/.test(status) ? 'bad' : /APPROVED|READY|COMPLETED/.test(status) ? 'ok' : 'warn';
  return h('span', { class: 'chip ' + cls, text: label || status || '상태 없음' });
}

// ---------------------------------------------------------------- loading
function loadDashboard() {
  return call('apiGetDashboard').then(function (res) {
    if (!res.ok) { renderFatal(res.error); return; }
    S.dash = res;
    document.getElementById('user').textContent = res.user + ' · Google Sheets 기준 · 코드 ' + (res.codeVersion || '이전 버전');
    renderNav(); if (!S.detail) renderList();
  });
}
function openReel(reelId) {
  busy(true, '불러오는 중…');
  return call('apiGetReel', reelId).then(function (res) {
    busy(false);
    if (!res.ok) { toast(res.error, 6000); return; }
    S.detail = res.detail; S.mode = 'view'; renderDetail(); window.scrollTo(0, 0);
  });
}
// Reloads list data (badges, sibling chips) without leaving the open reel.
function refreshAround() {
  return loadDashboard().then(function () { if (S.detail && S.mode === 'view') renderDetail(); });
}
function backToList() { S.detail = null; S.mode = 'view'; loadDashboard().then(renderList); window.scrollTo(0, 0); }

function renderFatal(msg) {
  clear(document.getElementById('main')).appendChild(h('div', { class: 'banner bad', text: msg }));
}

// ---------------------------------------------------------------- nav + lists
function renderNav() {
  const nav = clear(document.getElementById('nav'));
  const reels = (S.dash && S.dash.reels) || [];
  TABS.forEach(function (t) {
    const n = t.badge ? reels.filter(function (r) { return t.badge.indexOf(r.status) !== -1; }).length : 0;
    nav.appendChild(h('button', {
      type: 'button', class: S.tab === t.key && !S.detail ? 'on' : '',
      onclick: function () { S.tab = t.key; S.detail = null; renderNav(); renderList(); window.scrollTo(0, 0); },
    }, [h('span', { class: 'ico', text: t.ico }), t.label, n ? h('span', { class: 'n', text: String(n) }) : null]));
  });
}

function warningsBanner(list) {
  return (list || []).map(function (w) { return h('div', { class: 'banner warn', text: '⚠ ' + w }); });
}

function renderList() {
  const main = clear(document.getElementById('main'));
  const tab = TABS.filter(function (t) { return t.key === S.tab; })[0];
  document.getElementById('title').textContent = '릴스 팩토리 · ' + tab.label;
  warningsBanner(S.dash.warnings).forEach(function (b) { main.appendChild(b); });
  if (tab.key === 'products') { renderBrand(main); renderProducts(main); return; }
  const reels = S.dash.reels.filter(function (r) { return tabFor(r.status) === tab.key; });
  const intro = {
    script: '② 대본을 검토하세요. 승인된 대본 버전만 영상 제작에 쓰입니다.',
    make: 'Google Flow 클립은 수동 생성입니다. 프롬프트를 복사해 Flow에서 만든 뒤, 완성 MP4를 Drive에 올려 등록하세요.',
    video: '③ 완성 영상을 재생해 보고 승인/수정 요청/반려하세요.',
    publish: '④ 게시 자료를 복사해 직접 인스타그램에 올리고 ManyChat을 설정한 뒤 확인을 누르세요. 자동 게시는 하지 않습니다.',
    done: '완료·반려된 릴스와 상태 확인이 필요한 행입니다.',
  }[tab.key];
  main.appendChild(h('p', { class: 'muted', text: intro }));
  if (!reels.length) { main.appendChild(h('div', { class: 'empty', text: '항목이 없습니다' })); return; }
  reels.forEach(function (r) {
    main.appendChild(h('div', { class: 'card tap', role: 'button', tabindex: '0', onclick: function () { openReel(r.reelId); } }, [
      h('div', { class: 'row', style: 'justify-content:space-between' }, [
        h('strong', { text: r.reelId }), statusChip(r.status, r.statusLabel),
      ]),
      h('div', { class: 'muted', text: r.productName + ' · 대본 v' + r.scriptVersion + (r.videoVersion ? ' · 영상 v' + r.videoVersion : '') }),
      h('div', { class: 'hook', text: r.hook }),
      h('div', { class: 'muted', text: r.concept }),
      r.pillar ? h('span', { class: 'chip', text: r.pillar }) : null,
      r.error ? h('div', { class: 'banner bad', style: 'margin:8px 0 0', text: r.error }) : null,
    ]));
  });
}

// Brand and content-pillar mix (editorial targets are a planning aid, not a rule per product).
function renderBrand(main) {
  const b = S.dash.brand;
  if (!b) return;
  const mix = S.dash.pillarMix || [];
  main.appendChild(h('div', { class: 'card' }, [
    h('strong', { text: b.name }),
    h('div', { class: 'muted', text: '“' + b.tagline + '”' }),
    b.focus ? h('div', { class: 'banner ok', style: 'margin:8px 0', text: b.focus }) : null,
    h('h3', { text: '콘텐츠 기둥 (현재 / 목표)' }),
    h('div', {}, mix.map(function (m) {
      return h('div', { class: 'row', style: 'justify-content:space-between' }, [
        h('span', { text: m.label }),
        h('span', { class: 'muted', text: m.count + '개 · ' + m.share + '% / ' + m.target + '%' }),
      ]);
    })),
  ]));
}

function renderProducts(main) {
  // Step 1: Product URL → create/select product project
  const createCard = h('div', { class: 'card' });
  createCard.appendChild(h('h3', { style: 'margin-top:0', text: '① 상품 URL로 프로젝트 생성 / 선택' }));
  createCard.appendChild(h('div', { class: 'muted', text: '쿠팡 또는 제품 링크를 입력하여 새 상품 프로젝트를 만들거나 기존 프로젝트를 선택합니다.' }));

  const urlInput = h('input', { type: 'url', placeholder: '상품 URL (예: https://link.coupang.com/… 또는 제품 링크)' });
  const nameInput = h('input', { type: 'text', placeholder: '상품명 (예: 리템 우산꽂이 자석형, 비워두면 자동)' });
  const featInput = h('textarea', { rows: '2', placeholder: '확인된 핵심 기능 (줄 단위, 선택 사항)' });
  const createBtn = h('button', { class: 'b primary', type: 'button', text: '프로젝트 생성 / 선택' });

  createBtn.addEventListener('click', function () {
    const u = urlInput.value.trim();
    if (!u) { toast('상품 URL을 입력하세요.'); return; }
    busy(true, '프로젝트 생성/조회 중…');
    call('apiCreateProductProject', { url: u, name: nameInput.value.trim(), features: featInput.value.trim() }).then(function (res) {
      busy(false);
      if (!res.ok) { toast(res.error, 8000); return; }
      toast(res.created ? '새 상품 프로젝트 생성: ' + res.product.id : '기존 상품 프로젝트 선택: ' + res.product.id);
      loadDashboard().then(function () { renderNav(); renderList(); });
    });
  });

  createCard.appendChild(h('div', { style: 'display:flex;flex-direction:column;gap:8px;margin-top:10px' }, [
    urlInput, nameInput, featInput, createBtn
  ]));
  main.appendChild(createCard);

  main.appendChild(h('h3', { text: '등록된 상품 목록' }));
  if (!S.dash.products.length) { main.appendChild(h('div', { class: 'empty', text: 'PRODUCTS에 상품이 없습니다' })); return; }
  S.dash.products.forEach(function (p) {
    const ready = p.factsCount > 0 && !p.duplicate;
    main.appendChild(h('div', { class: 'card' }, [
      h('div', { class: 'row', style: 'justify-content:space-between' }, [h('strong', { text: p.id }), h('span', { class: 'muted', text: '릴스 ' + p.reelCount + '개' })]),
      h('div', { text: p.name }),
      h('div', { class: 'row', style: 'margin-top:6px' }, [
        h('span', { class: 'chip ' + (p.factsCount ? 'ok' : 'bad'), text: '확인된 기능 ' + p.factsCount }),
        h('span', { class: 'chip ' + (p.affiliateUrlOk ? 'ok' : 'warn'), text: p.affiliateUrlOk ? '제휴 링크 ✓' : '제휴 링크 필요' }),
        h('span', { class: 'chip ' + (p.permissionOk ? 'ok' : 'warn'), text: '영상 허가: ' + p.permission }),
        p.duplicate ? h('span', { class: 'chip bad', text: '상품ID 중복' }) : null,
      ]),
      h('div', { class: 'btns one' }, [h('button', {
        class: 'b', type: 'button', disabled: !ready,
        onclick: function () { generate(p, false); },
        text: p.reelCount ? '③ 대본 컨셉 및 훅 5개 추가 생성' : '③ 대본 컨셉 및 훅 5개 생성 (Gemini)',
      })]),
    ]));
  });
}

function generate(p, allowAdditional) {
  if (!allowAdditional && !confirm(p.id + ' 훅 5개와 대본 1개를 Gemini로 생성할까요? (API 호출 1~2회)')) return;
  busy(true, 'Gemini로 대본 생성 중… (최대 1분)');
  call('apiGenerateScripts', p.id, allowAdditional).then(function (res) {
    busy(false);
    if (!res.ok) { toast(res.error, 8000); return; }
    if (res.needsConfirm) {
      if (confirm('이미 릴스 ' + res.needsConfirm + '개가 있습니다. 새 훅 5개와 대본을 추가로 생성할까요?')) generate(p, true);
      return;
    }
    toast('생성 완료: ' + res.ids.join(', '));
    S.tab = 'script'; loadDashboard().then(function () { renderNav(); renderList(); });
  });
}

// ---------------------------------------------------------------- detail
function act(action, input, confirmText) {
  const d = S.detail;
  if (confirmText && !confirm(confirmText)) return;
  const base = { expectedStatus: d.summary.status, expectedScriptVersion: d.summary.scriptVersion, expectedVideoVersion: d.summary.videoVersion };
  busy(true);
  call('apiAction', d.summary.reelId, action, Object.assign(base, input || {})).then(function (res) {
    busy(false);
    if (!res.ok) { toast(res.error, 8000); return; }
    S.detail = res.detail; S.mode = 'view'; renderDetail();
    toast(res.notice || '저장했습니다 (REELS·AUDIT 기록)', res.notice ? 8000 : 2500);
    refreshAround();
  });
}
function askNote(promptText, required) {
  const v = prompt(promptText, '');
  if (v === null) return null;
  if (required && !v.trim()) { toast('메모(사유)를 입력해야 합니다.'); return null; }
  return v.trim();
}

function renderActions(main) {
  const d = S.detail;
  const can = function (a) { return d.allowedActions.indexOf(a) !== -1; };
  const card = h('div', { class: 'card' });
  const st = d.summary.status;

  if (st === 'SCRIPT_REVIEW_PENDING' || st === 'SCRIPT_CHANGES_REQUESTED') {
    card.appendChild(h('h3', { style: 'margin-top:0', text: '② 대본 검토' }));
    if (st === 'SCRIPT_CHANGES_REQUESTED') {
      card.appendChild(h('div', { class: 'banner warn', text: '수정 요청: ' + (d.scriptReview.note || '') }));
    }
    // Verification flags: the reviewer confirms they are real (or labelled) before approving.
    const flags = d.verificationFlags || [];
    let flagBox = null;
    if (flags.length) {
      flagBox = h('input', { type: 'checkbox', id: 'flagsOk' });
      card.appendChild(h('div', { class: 'banner warn' }, [
        h('strong', { text: '확인 필요 ' + flags.length + '건 — 승인 전에 실제 경험·테스트·AI 표시인지 확인하세요' }),
        h('ul', { style: 'margin:6px 0;padding-left:20px' }, flags.map(function (f) { return h('li', { text: f }); })),
        h('label', { style: 'display:flex;gap:8px;align-items:center' }, [flagBox, h('span', { text: '모두 확인했습니다' })]),
      ]));
    }
    // The operator confirms they reviewed the script with the chosen hook (required by the server too).
    let reviewedBox = null;
    if (can('APPROVE_SCRIPT') && d.hooks && d.hooks.selectionValid) {
      reviewedBox = h('input', { type: 'checkbox', id: 'hookReviewed' });
      card.appendChild(h('label', { style: 'display:flex;gap:8px;align-items:center;margin:4px 0 10px' }, [reviewedBox, h('span', { text: '선택한 훅이 반영된 대본 v' + d.summary.scriptVersion + '을(를) 끝까지 확인했습니다' })]));
    }
    const b = h('div', { class: 'btns' });
    if (can('APPROVE_SCRIPT')) b.appendChild(h('button', { class: 'b ok', type: 'button', text: '승인 (v' + d.summary.scriptVersion + ')',
      onclick: function () {
        if (d.hooks && d.hooks.required && !d.hooks.selectionValid) { alert('먼저 위 "훅 고르기"에서 훅을 하나 고르세요.'); return; }
        if (!reviewedBox || !reviewedBox.checked) { alert('선택한 훅이 반영된 대본을 확인했다고 체크한 뒤 승인하세요.'); return; }
        if (flagBox && !flagBox.checked) { alert('확인 필요 항목을 확인한 뒤 "모두 확인했습니다"에 체크하세요.'); return; }
        act('APPROVE_SCRIPT', { note: '', flagsConfirmed: !!(flagBox && flagBox.checked), hookReviewed: true }, '대본 v' + d.summary.scriptVersion + '을(를) 승인합니다. 이 버전 그대로 영상 제작에 사용됩니다.');

    if (can('EDIT_SCRIPT')) b.appendChild(h('button', { class: 'b', type: 'button', text: '직접 수정', onclick: function () { S.mode = 'edit'; renderDetail(); } }));
    if (can('REQUEST_SCRIPT_CHANGES')) b.appendChild(h('button', { class: 'b', type: 'button', text: '수정 요청',

    card.appendChild(b);

// 📱 Media workspace: verified product photos, Google Flow clips (copy prompt → open Flow by hand → upload
// from this phone), per-clip review. Flow is never automated. The server checks everything again.
const MEDIA_RETRIES = 3;
const CLIP_STATUS = { MISSING: ['clip', '클립 없음'], PENDING_REVIEW: ['warn', '검토 대기'], APPROVED: ['ok', '승인됨'], REJECTED: ['bad', '다시 만들기'] };

function reloadDetail(msg) {

function guardOf() {
  const d = S.detail;
  return { expectedStatus: d.summary.status, expectedScriptVersion: d.summary.scriptVersion };
}
function readChunkB64(file, off, len) {
  return new Promise(function (resolve, reject) {
    const fr = new FileReader();
    fr.onload = function () { resolve(String(fr.result).split(',')[1] || ''); };
    fr.onerror = function () { reject(fr.error || new Error('파일을 읽지 못했습니다')); };
    fr.readAsDataURL(file.slice(off, off + len));
  });
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

// Shrinks a phone photo (max 2048 px, JPEG) so it fits the size limit; returns a base64 string.
function photoToB64(file, maxBytes) {
  return new Promise(function (resolve, reject) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function () {
      let side = 2048, q = 0.85;
      for (let i = 0; i < 6; i++) {
        const k = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const b64 = c.toDataURL('image/jpeg', q).split(',')[1];
        if (b64.length * 0.75 <= maxBytes) { URL.revokeObjectURL(url); return resolve(b64); }
        side = Math.round(side * 0.75); q = Math.max(0.6, q - 0.05);
      }
      URL.revokeObjectURL(url); reject(new Error('사진을 충분히 줄이지 못했습니다.'));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('이 사진을 열 수 없습니다. JPEG 또는 PNG로 올려 주세요.')); };
    img.src = url;
  });
}

// One clip, in chunks. Each chunk is retried; after a doubtful failure the server is asked where to resume.
async function uploadClip(c, file, rights, ui) {
  if (!file) { toast('영상을 고르세요.'); return; }
  if (!rights.checked) { toast('영상 권리 확인에 체크하세요.'); return; }
  const mime = file.type || (/\.mov$/i.test(file.name) ? 'video/quicktime' : /\.mp4$/i.test(file.name) ? 'video/mp4' : '');
  ui.disabled(true); ui.say('시작 중…'); ui.progress(0);
  const start = await call('apiStartClipUpload', S.detail.summary.reelId, Object.assign({ clip: c.key, fileName: file.name, mime: mime, size: file.size, rightsConfirmed: true }, guardOf()));
  if (!start.ok) { ui.say(start.error, true); ui.disabled(false); return; }
  let off = 0, last = null;
  while (off < file.size) {
    const len = Math.min(start.chunkBytes, file.size - off);
    let res = null;
    for (let attempt = 1; attempt <= MEDIA_RETRIES; attempt++) {
      const data = await readChunkB64(file, off, len);
      res = await call('apiUploadClipChunk', start.uploadId, off, data);
      if (res.ok) break;
      if (/^RETRY:/.test(res.error)) { ui.say('다시 시도 중 (' + attempt + '/' + MEDIA_RETRIES + ')…'); await sleep(1500 * attempt); continue; }
      // Unsure what Drive has: ask, then continue from its answer.
      const st = await call('apiClipUploadStatus', start.uploadId);
      if (st.ok && st.done) { res = st; break; }
      if (st.ok && st.next !== off) { res = { ok: true, done: false, next: st.next }; break; }
      if (!st.ok && !/RETRY:/.test(st.error)) break;
    }
    if (!res || !res.ok) {
      ui.say((res && res.error ? res.error.replace(/^RETRY:\s*/, '') : '업로드에 실패했습니다.') + '\n같은 영상을 다시 고르고 올리면 처음부터 새로 시작합니다. 계속 실패하면 아래 "Drive 앱으로 올린 파일 연결"을 쓰세요.', true);
      ui.disabled(false); return;
    }
    last = res;
    off = res.done ? file.size : res.next;
    ui.progress(Math.round(off * 100 / file.size));
    ui.say(Math.round(off / 1048576 * 10) / 10 + ' / ' + Math.round(file.size / 1048576 * 10) / 10 + ' MB');
  }
  if (!last || !last.done) { ui.say('업로드가 끝났지만 등록되지 않았습니다. 새로고침 후 다시 확인하세요.', true); ui.disabled(false); return; }
  toast(c.key + ' v' + last.version + ' 업로드 완료' + (last.invalidated ? ' — 이전 승인은 무효가 되었습니다' : '') + '. 미리보고 승인하세요.', 6000);
  await reloadDetail();
}

function uiFor(box, controls) {
  const msg = h('div', { class: 'muted', style: 'white-space:pre-wrap' });

function confirmStoryboardBilling(count, isRegen, sceneNo) {
  const sb = (S.detail && S.detail.storyboard) || {};
  const model = sb.model || 'gemini-2.5-flash-image';
  const billing = sb.billing || {};
  const perImageUsd = billing.perImageUsd != null ? billing.perImageUsd : null;
  let costLine = '예상 총 비용: 비용 추정치 미설정 (Cost estimate unavailable)';
  if (perImageUsd != null && isFinite(perImageUsd)) {
    const total = count * perImageUsd;
    const totalStr = (total < 0.01 && total > 0) ? total.toFixed(4) : total.toFixed(2);
    costLine = '예상 총 비용: ~$' + totalStr + ' USD (추정치 / Estimate, 확정 금액 아님)';
  }

  const title = isRegen
    ? '장면 S' + sceneNo + ' 스토리보드 이미지 재생성 확인'
    : (count === 1 ? '장면 S' + sceneNo + ' 스토리보드 이미지 생성 확인' : '전체(' + count + '개 장면) 스토리보드 이미지 생성 확인');

  const warning = billing.warning ||
    '실제 청구 금액은 다를 수 있으며, 실패하거나 재시도된 API 호출에도 요금이 발생할 수 있습니다 (Actual charges may differ and failed/retried calls may incur charges).';

  const message = [
    '[' + title + ']',
    '',
    '• 생성 이미지 수: ' + count + '장',
    '• 사용 모델: ' + model,
    '• ' + costLine,
    '',
    '⚠️ 주의사항:',
    warning,
    '',
    '유료 Gemini API 호출을 진행할까요?'
  ].join('\n');

  return confirm(message);
}

    if (!res.ok) { toast(res.error, 8000); return; }
    S.detail = res.detail; renderDetail();
    toast(c.key + (decision === 'APPROVE' ? ' 이미지 승인됨' : ' 이미지 수정 요청됨 (종속 비디오 승인 취소)'));
    refreshAround();
  });
}

function regenerateStoryboard(c) {
  if (S.generatingStoryboard) return;
  const d = S.detail;
  if (!d || !d.storyboard) return;
  const note = askNote(c.key + ' 재생성 메모 (선택사항 — 비워두면 이전 메모 또는 대본을 바탕으로 재생성합니다):', false);
  if (note === null) return;

  if (!confirmStoryboardBilling(1, true, c.scene)) return;

  S.generatingStoryboard = true;
  busy(true, c.key + ' 이미지 재생성 중…');
  call('apiRegenerateStoryboardImage', d.summary.reelId, {
    scene: c.scene,
    note: note || undefined,
    confirmedBilling: true,
    expectedStatus: d.summary.status,
    expectedScriptVersion: d.summary.scriptVersion
  }).then(function (res) {
    S.generatingStoryboard = false;
    busy(false);
    if (!res.ok) { toast(res.error, 9000); return; }
    S.detail = res.detail; renderDetail();
    toast(c.key + ' 새 이미지가 생성되었습니다 (이전 승인은 무효화됨).');
    refreshAround();
  }).catch(function (err) {
    S.generatingStoryboard = false;
    busy(false);
    toast(String(err), 9000);
  });
}

function recoverStoryboard(sceneNo, fileId) {
  const d = S.detail;
  if (!d) return;
  busy(true, '장면 S' + sceneNo + ' Drive 이미지 복구 중… (과금 없음)');
  call('apiRecoverStoryboardImage', d.summary.reelId, { scene: sceneNo, fileId: fileId }).then(function (res) {
    busy(false);
    if (!res.ok) { toast(res.error, 9000); return; }
    S.detail = res.detail; renderDetail();
    toast('Drive 이미지를 복구했습니다 (Gemini API 호출 없음).');
    refreshAround();
  }).catch(function (err) {
    busy(false);
    toast(String(err), 9000);
  });
}

const STORYBOARD_STATUS = {
  MISSING: ['chip', '이미지 없음'],
  PENDING_REVIEW: ['chip warn', '검토 대기'],
  APPROVED: ['chip ok', '승인됨'],
  REJECTED: ['chip bad', '수정 요청됨'],
};

  const d = S.detail;

    card.appendChild(h('div', { class: 'banner ok', text: '모든 장면의 9:16 이미지가 승인되었습니다. 각 장면의 이미지를 다운로드하고 모션 프롬프트를 복사하여 Google Flow에서 영상을 제작하세요.' }));

function renderMedia(main) {

  if (md.blocker) { card.appendChild(h('div', { class: 'banner warn', text: md.blocker })); main.appendChild(card); return; }

  // Verified product reference photos (max 4): saved in Drive, linked into this product's PRODUCTS cell.
  const ref = md.references;

  if (md.gated && md.allApproved) card.appendChild(h('div', { class: 'banner ok', text: '모든 장면이 승인되었습니다. 이제 렌더 작업 파일을 받을 수 있습니다 (최종 영상 승인과 게시는 직접).' }));
  const prompts = {};

  md.clips.forEach(function (c) {

        } }),
        h('a', { href: c.current.url, target: '_blank', rel: 'noopener', text: 'Drive에서 열기' }),
      ]));
      box.appendChild(prev);
      if (c.status === 'PENDING_REVIEW' || c.status === 'APPROVED') {
        box.appendChild(h('div', { class: 'btns' }, [
          c.status === 'PENDING_REVIEW' ? h('button', { class: 'b ok', type: 'button', text: '승인', onclick: function () { reviewClip(c, 'APPROVE'); } }) : null,
          h('button', { class: 'b bad', type: 'button', text: c.status === 'APPROVED' ? '승인 취소·다시 만들기' : '반려·다시 만들기', onclick: function () { reviewClip(c, 'REJECT'); } }),
        ]));

    }
    // Upload (or replace). The rights confirmation is required for every upload.
    const pick = h('input', { type: 'file', accept: 'video/mp4,video/quicktime,.mp4,.mov' });
    const ok = h('input', { type: 'checkbox' });
    const btn = h('button', { class: 'b primary', type: 'button', text: c.current ? '교체 업로드 (새 버전)' : '영상 업로드' });

    btn.addEventListener('click', function () { uploadClip(c, pick.files && pick.files[0], ok, ui); });
    box.appendChild(h('div', { style: 'margin-top:8px' }, [pick]));
    box.appendChild(h('label', { style: 'display:flex;gap:8px;align-items:flex-start' }, [ok, h('span', { text: 'Google Flow로 직접 만들었거나 사용 권한을 확인한 영상입니다' })]));
    box.appendChild(h('div', { class: 'btns one' }, [btn]));
    box.appendChild(ubox);
    // Fallback: a file put into this reel's Drive folder with the Drive app.
    (c.attachable || []).forEach(function (a) {
      box.appendChild(h('div', { class: 'row', style: 'margin-top:6px' }, [
        h('span', { class: 'muted', text: 'Drive 앱으로 올린 파일: ' + a.name }),
        h('button', { class: 'b', type: 'button', text: '이 파일 연결', onclick: function () { attachClip(c, a, ok); } }),

    });
    if (c.versions.length > 1 || (c.versions[0] && c.versions[0].status !== 'PENDING_REVIEW')) {
      box.appendChild(h('details', { style: 'margin-top:6px' }, [
        h('summary', { text: '버전 기록 (' + c.versions.length + ')' }),
        h('div', { class: 'muted', style: 'white-space:pre-wrap', text: c.versions.map(function (v) { return 'v' + v.v + ' · ' + v.status + ' · ' + fmt(v.uploadedAt) + ' · ' + v.source + (v.note ? ' · ' + v.note : ''); }).join('\n') }),
      ]));
    }
    card.appendChild(box);
  });
  card.appendChild(h('div', { class: 'muted', text: '업로드가 계속 실패하면 Drive 앱으로 "Reels Factory/' + d.product.id + '/' + d.summary.reelId + '" 폴더에 올린 뒤 위 "이 파일 연결"을 쓰세요 (제작 계획 카드의 "Drive 동기화" 후 표시).' }));
  main.appendChild(card);
}

// ② Five hooks (H1–H5): Gemini recommends, the operator chooses (and may edit the wording).
// Shown for every script under review — including scripts written before the five-hook workflow.
function renderHooks(main) {
  const d = S.detail;
  const hk = d.hooks;
  const st = d.summary.status;
  const reviewing = st === 'SCRIPT_REVIEW_PENDING' || st === 'SCRIPT_CHANGES_REQUESTED';
  if (!hk || (!reviewing && !(hk.candidates || []).length)) return;
  const card = h('div', { class: 'card' });
  card.appendChild(h('h3', { style: 'margin-top:0', text: '① 훅 고르기 (5개 중 1개 — 최종 선택은 직접)' }));
  if (hk.columnsMissing) {
    card.appendChild(h('div', { class: 'banner bad', text: 'REELS 시트에 "훅 후보(JSON)"·"선택한 훅" 열이 없습니다. Google Sheets에서 "릴스 팩토리 → 시트 준비"를 실행한 뒤 이 화면을 새로고침하세요. 기존 데이터는 바뀌지 않습니다. 훅을 고르기 전에는 승인할 수 없습니다.' }));
    main.appendChild(card);
    return;
  }
  if (!hk.candidates.length) {
    card.appendChild(h('div', { class: 'banner warn', text: '이 대본에는 훅 후보가 없습니다 (훅 5개 기능 이전에 만든 대본). 훅 5개를 만들어 하나를 고른 뒤 승인할 수 있습니다. 대본 자체는 바뀌지 않습니다.' }));
    if (hk.canGenerate) card.appendChild(h('div', { class: 'btns' }, [
      h('button', { class: 'b primary', type: 'button', text: '훅 5개 만들기 (Gemini 1회)', onclick: makeHooks }),
    ]));
    main.appendChild(card);
    return;
  }
  if (!hk.selectionValid) {
    card.appendChild(h('div', { class: 'banner warn', text: '승인하려면 먼저 훅을 하나 고르세요. ★추천은 참고만 하세요.' }));
  } else {
    card.appendChild(h('div', { class: 'banner ok', text: '선택한 훅: ' + hk.selected.id + ' ' + (hk.selected.label || '') + (hk.selected.edited ? ' (수정)' : '') + ' · 대본 v' + hk.selected.scriptVersion + (hk.selected.by ? ' · ' + hk.selected.by : '') + '\n아래 "대본"에서 바뀐 첫 장면과 전체 흐름을 확인한 뒤 승인하세요.' }));
    if ((hk.selectedWarnings || []).length) {
      card.appendChild(h('div', { class: 'banner warn', text: '⚠ 고친 훅 문장 참고 (승인은 막지 않음): ' + hk.selectedWarnings.join(' / ') }));
    }
  }
  const edit = h('textarea', { rows: '2' });
  let chosen = null;
  hk.candidates.forEach(function (c) {
    const isRec = hk.recommended && hk.recommended.id === c.id;
    const isSel = hk.selected && hk.selected.id === c.id && hk.selectionValid;
    const radio = h('input', { type: 'radio', name: 'hookPick', value: c.id });
    if (isSel || (!hk.selectionValid && isRec)) { radio.checked = true; chosen = c; edit.value = isSel ? hk.selected.text : c.text; }
    radio.addEventListener('change', function () { chosen = c; edit.value = c.text; });
    card.appendChild(h('label', { class: 'scene', style: 'display:flex;gap:10px;align-items:flex-start' }, [
      radio,
      h('div', {}, [
        h('div', { class: 'row' }, [
          h('strong', { text: c.id + ' · ' + c.label }),
          isRec ? h('span', { class: 'chip ok', text: '★ 추천' }) : null,
          isSel ? h('span', { class: 'chip', text: '선택됨' }) : null,
        ]),
        h('div', { class: 'hook', text: c.text }),
        // Style warnings: safe to use; the operator may still pick, edit, or have Gemini improve this one hook.
        ((hk.warnings || {})[c.id] || []).length ? h('div', { class: 'hookwarn' }, [
          h('div', { text: '⚠ 스타일 참고 (사용 가능 · 승인은 막지 않음)' }),
          h('ul', { style: 'margin:4px 0;padding-left:20px' }, hk.warnings[c.id].map(function (w) { return h('li', { text: w }); })),
          hk.canRevise ? h('button', { class: 'b', type: 'button', text: '이 훅만 다듬기 (Gemini 1회)', onclick: function (ev) { ev.preventDefault(); ev.stopPropagation(); reviseHook(c); } }) : null,
        ]) : null,
        c.visual ? h('div', { class: 'muted', text: '첫 장면: ' + c.visual }) : null,
        isRec && hk.recommended.reason ? h('div', { class: 'muted', text: '추천 이유: ' + hk.recommended.reason }) : null,
      ]),
    ]));
  });
  if (hk.canSelect) {
    card.appendChild(h('label', { text: '훅 문장 (고칠 수 있음 · 확인된 기능 밖의 내용은 거부됩니다)' }));
    card.appendChild(edit);
    card.appendChild(h('div', { class: 'btns' }, [
      h('button', { class: 'b ok', type: 'button', text: '이 훅으로 정하기 (무료)', onclick: function () { pickHook(chosen, edit.value, 'keep'); } }),
      h('button', { class: 'b primary', type: 'button', text: '대본 다시 쓰기 (Gemini)', onclick: function () { pickHook(chosen, edit.value, 'regenerate'); } }),
    ]));
    card.appendChild(h('div', { class: 'muted', text: '"정하기"는 첫 장면(말·자막·화면 연출·Flow 프롬프트)을 이 훅의 것으로 바꿉니다 (무료). "다시 쓰기"는 이 훅에 맞게 대본 전체를 Gemini로 새로 씁니다 (호출 1~2회). 바뀐 대본은 새 버전이 되고, 확인 후 승인합니다.' }));
  }
  main.appendChild(h('h2', { text: '훅' }));
  main.appendChild(card);
}

function makeHooks() {
  const d = S.detail;
  if (!confirm('이 대본에 쓸 훅 5개를 Gemini로 만들까요? (API 호출 1~3회, 대본은 바뀌지 않습니다)')) return;
  busy(true, 'Gemini로 훅 5개 만드는 중… (최대 1분)');
  call('apiGenerateHooks', d.summary.reelId, { expectedStatus: d.summary.status, expectedScriptVersion: d.summary.scriptVersion }).then(function (res) {
    busy(false);
    if (!res.ok) { toast(res.error, 8000); return; }
    S.detail = res.detail; renderDetail();
    toast('훅 5개를 만들었습니다. 하나를 고르세요.');
  });
}

function reviseHook(c) {
  const d = S.detail;
  if (!confirm(c.id + ' 훅 하나만 Gemini로 다듬을까요? (API 호출 1회, 다른 훅과 대본은 바뀌지 않습니다)')) return;
  busy(true, 'Gemini로 ' + c.id + ' 다듬는 중… (최대 30초)');
  call('apiReviseHook', d.summary.reelId, { hookId: c.id, expectedStatus: d.summary.status, expectedScriptVersion: d.summary.scriptVersion }).then(function (res) {
    busy(false);
    if (!res.ok) { toast(res.error, 8000); return; }
    S.detail = res.detail; renderDetail();
    toast(res.notice || '훅을 다듬었습니다.', 6000);
  });
}

function pickHook(chosen, text, mode) {
  const d = S.detail;
  if (!chosen) { toast('훅을 하나 고르세요.'); return; }
  text = String(text || '').trim();
  if (!text) { toast('훅 문장이 비어 있습니다.'); return; }
  if (mode === 'regenerate' && !confirm('이 훅으로 대본 전체를 Gemini로 다시 쓸까요? (API 호출 1~2회, 새 대본 버전)')) return;
  busy(true, mode === 'regenerate' ? 'Gemini로 대본 다시 쓰는 중… (최대 1분)' : '저장 중…');
  call('apiSelectHook', d.summary.reelId, {
    hookId: chosen.id, text: text, mode: mode,
    expectedStatus: d.summary.status, expectedScriptVersion: d.summary.scriptVersion,
  }).then(function (res) {
    busy(false);
    if (!res.ok) { toast(res.error, 8000); return; }
    S.detail = res.detail; renderDetail();
    toast('훅 ' + chosen.id + ' 선택 · 대본 v' + res.detail.summary.scriptVersion + ' (REELS·AUDIT 기록)');
    refreshAround();
  });
}

function regenerate() {
  const d = S.detail;
  if (!confirm('수정 요청 메모를 반영해 이 대본 1개를 Gemini로 다시 작성할까요? (API 호출 1~2회)')) return;
  busy(true, 'Gemini로 재생성 중… (최대 1분)');
  call('apiRegenerateScript', d.summary.reelId, { expectedScriptVersion: d.summary.scriptVersion }).then(function (res) {
    busy(false);
    if (!res.ok) { toast(res.error, 8000); return; }
    S.detail = res.detail; renderDetail(); toast('새 버전 v' + res.detail.summary.scriptVersion + '이(가) 검토 대기 중입니다.');
    refreshAround();
  });
}

// Signed render job for the Mac/cloud renderer. Issued only for approved reels in production.
function openRenderJob() {
  busy(true);
  call('apiGetRenderJob', S.detail.summary.reelId).then(function (res) {
    busy(false);
    if (!res.ok) { toast(res.error, 8000); return; }
    const main = clear(document.getElementById('main'));
    main.appendChild(h('button', { class: 'link', type: 'button', onclick: renderDetail, text: '‹ ' + S.detail.summary.reelId }));
    main.appendChild(h('div', { class: 'banner warn', text: '이 파일은 72시간 동안 유효합니다. Mac에서 renderer/jobs/' + res.fileName + ' 로 저장한 뒤:\n\nnpm run render:fetch-clips -- --job renderer/jobs/' + res.fileName + '\n(승인한 클립을 Drive에서 내려받음)\nnpm run render -- --job renderer/jobs/' + res.fileName + ' --dry-run\n(비용·계획 확인 후) --dry-run 없이 다시 실행' }));
    const a = h('a', { href: 'data:application/json;charset=utf-8,' + encodeURIComponent(res.jobFile), download: res.fileName, text: '파일 다운로드 ↓' });
    main.appendChild(h('div', { class: 'card' }, [a, copyBlock(res.fileName, res.jobFile, true)]));
    window.scrollTo(0, 0);
  });
}

function openPack() {
  busy(true);
  call('apiGetPublishingPack', S.detail.summary.reelId).then(function (res) {
    busy(false);
    if (!res.ok) { toast(res.error, 6000); return; }
    const p = res.pack;
    const main = clear(document.getElementById('main'));
    main.appendChild(h('button', { class: 'link', type: 'button', onclick: renderDetail, text: '‹ ' + p.reelId }));
    main.appendChild(h('div', { class: 'banner warn', text: '자동 게시·자동 DM은 하지 않습니다. 아래 순서대로 직접 진행하세요.' }));
    main.appendChild(h('div', { class: 'card' }, [
      h('h3', { style: 'margin-top:0', text: '1. 영상' }),
      h('a', { href: p.videoUrl, target: '_blank', rel: 'noopener', text: 'Drive에서 MP4 열기 ↗' }),
      h('div', { class: 'muted', text: 'Drive 앱 → ⋯ → 사본 보내기 → 동영상 저장' }),
    ]));
    main.appendChild(h('div', { class: 'card' }, [h('h3', { style: 'margin-top:0', text: '2. 인스타그램 캡션' }), copyBlock('첫 줄 광고 표기 유지', p.instagramCaption)]));
    main.appendChild(h('div', { class: 'card' }, [
      h('h3', { style: 'margin-top:0', text: '3. ManyChat' }),
      copyBlock('댓글 키워드', p.manychatKeyword, true),
      copyBlock('DM 문구 (쿠팡 파트너스 링크 포함)', p.manychatDm),
      copyBlock('쿠팡 파트너스 링크', p.affiliateUrl, true),
    ]));
    main.appendChild(h('div', { class: 'card' }, [h('h3', { style: 'margin-top:0', text: '체크리스트' }),
      h('ol', { style: 'margin:0;padding-left:20px' }, p.checklist.map(function (c) { return h('li', { text: c }); }))]));
    window.scrollTo(0, 0);
  });
}

// ---------------------------------------------------------------- editor
function renderEditor(main) {
  const d = S.detail;
  const r = d.reel;
  // Storyboard scripts: each scene's line is the narration and the subtitle.
  const storyboard = (r.scenes || []).some(function (s) { return s.beat || s.narration; });
  const f = {};
  function field(key, label, value, multiline) {
    f[key] = multiline ? h('textarea', {}) : h('input', { type: 'text' });
    f[key].value = value || '';
    return h('div', {}, [h('label', { text: label }), f[key]]);
  }
  const card = h('div', { class: 'card' }, [
    h('div', { class: 'banner warn', text: '수정하면 새 버전(v' + (d.summary.scriptVersion + 1) + ')이 되고 다시 승인해야 합니다. 숫자·기능은 PRODUCTS의 확인된 기능에 있는 것만 쓸 수 있습니다.' }),
    d.pillars ? h('div', {}, [h('label', { text: '콘텐츠 기둥' }), (f.pillar = h('select', {}, [h('option', { value: '', text: '(그대로)' })].concat(d.pillars.map(function (p) {
      const o = h('option', { value: p.id, text: p.label });
      if (d.pillar && d.pillar.id === p.id) o.selected = true;
      return o;
    }))))]) : null,
    field('concept', '컨셉', r.concept),
    field('hook', '후킹 (40자 이내)', r.hook),
    storyboard ? null : field('narration', '내레이션 (300자 이내)', r.narration, true),
    storyboard ? null : field('captions', '자막 (한 줄에 하나, 각 40자 이내)', (r.captions || []).join('\n'), true),
  ]);
  (r.scenes || []).forEach(function (s, i) {
    card.appendChild(h('h3', { text: '장면 ' + s.scene_no + (s.beat ? ' · ' + s.beat : '') + ' · ' + s.duration_sec + '초' }));
    if (storyboard) card.appendChild(field('s' + i + 'line', '내레이션 = 자막 (30자 이내, CTA에는 {키워드})', s.narration));
    card.appendChild(field('s' + i + 'visual', '장면 설명', s.visual, true));
    if (!storyboard) card.appendChild(field('s' + i + 'text', '화면 문구', s.on_screen_text));
    card.appendChild(field('s' + i + 'flow', 'Flow 프롬프트 (영어)', s.flow_prompt, true));
    f['s' + i + 'ai'] = h('input', { type: 'checkbox' });
    f['s' + i + 'ai'].checked = !!s.ai_visualization;
    card.appendChild(h('label', { style: 'display:flex;gap:8px;align-items:center' }, [f['s' + i + 'ai'], h('span', { text: 'AI 시뮬레이션 장면 (영상에 표시)' })]));
  });
  card.appendChild(field('note', '수정 메모 (선택)', '', true));
  card.appendChild(h('div', { class: 'btns' }, [
    h('button', { class: 'b', type: 'button', text: '취소', onclick: function () { S.mode = 'view'; renderDetail(); } }),
    h('button', { class: 'b primary', type: 'button', text: '저장 (v' + (d.summary.scriptVersion + 1) + ')', onclick: function () {
      const edit = {
        concept: f.concept.value, hook: f.hook.value,
        pillar: f.pillar && f.pillar.value ? f.pillar.value : undefined,
        narration: storyboard ? undefined : f.narration.value,
        captions: storyboard ? undefined : f.captions.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean),
        scenes: (r.scenes || []).map(function (s, i) {
          const out = { visual: f['s' + i + 'visual'].value, flow_prompt: f['s' + i + 'flow'].value, ai_visualization: f['s' + i + 'ai'].checked };
          if (storyboard) out.narration = f['s' + i + 'line'].value; else out.on_screen_text = f['s' + i + 'text'].value;
          return out;
        }),
      };
      act('EDIT_SCRIPT', { edit: edit, note: f.note.value });
    } }),
  ]));
  main.appendChild(card);
}

loadDashboard();
</script>
